#panel h1,#boot h1{font-size:1.3rem;color:#0A4D30;margin:0 0 4px;text-align:center}
.sub{text-align:center;color:#75827B;font-size:.82rem;margin-bottom:18px}
.note{background:#F2EEE3;border-radius:12px;padding:12px 14px;font-size:.8rem;color:#44584E;line-height:1.7;margin-bottom:16px}
#panel label{display:block;font-size:.82rem;font-weight:500;margin:14px 0 6px}
#panel input{width:100%;padding:12px;border:1px solid #E7E1D2;border-radius:12px;font-family:inherit;font-size:.95rem;background:#fff;box-sizing:border-box}
#panel button{width:100%;padding:14px;border:none;border-radius:14px;font-family:inherit;font-size:.98rem;font-weight:700;margin-top:10px}
.pri{background:#0A4D30;color:#fff}.dan{background:#FDECEC;color:#C0392B}.sec{background:#F2EEE3;color:#22302A}
.msg{text-align:center;font-size:.85rem;min-height:20px;margin-top:12px;line-height:1.6}
.ver{text-align:center;font-size:.72rem;color:#8A9A92;margin-top:14px}
.hide{display:none!important}
a{color:#0A4D30}
</style>
</head>
<body>

<div id="root"></div>

<div id="boot">
  <h1>ديوان الإيجارات</h1>
  <div class="sub">جارٍ التحميل…</div>
  <div class="msg" id="bootMsg"></div>
</div>

<div id="panel" class="hide">
  <h1>لوحة تحديث التطبيق</h1>
  <div class="sub">خاصة بالمالك</div>
  <div id="pinBox">
    <label>رمز الإدارة</label>
    <input type="password" id="pin" inputmode="numeric" onkeydown="if(event.key==='Enter')checkPin()">
    <button class="pri" onclick="checkPin()">دخول</button>
    <div class="msg" id="pinMsg"></div>
  </div>
  <div id="tools" class="hide">
    <div class="note">اختر ملف <b>app.js</b> الجديد ثم اضغط نشر. سيصل التحديث لكل الأجهزة فوراً، وبيانات المستأجرين لا تتأثر إطلاقاً.</div>
    <label>ملف التطبيق (app.js)</label>
    <input type="file" id="file" accept=".js,.txt">
    <button class="pri" onclick="publish()">نشر النسخة الجديدة</button>
    <button class="dan" onclick="rollback()">الرجوع للنسخة السابقة</button>
    <button class="sec" onclick="downloadCur()">تنزيل النسخة الحالية</button>
    <button class="sec" onclick="location.hash='';location.reload()">رجوع للتطبيق</button>
    <div class="msg" id="msg"></div>
    <div class="ver" id="ver"></div>
  </div>
</div>

<script>
/* ═════════ الإعدادات ═════════ */
const FIREBASE_CONFIG = {
  apiKey:"AIzaSyCuBqtDkxXl8JBKNNm53vRq03fW_GhIkbk",
  authDomain:"zaid-f4b3d.firebaseapp.com",
  projectId:"zaid-f4b3d"
};
const ADMIN_PIN = "1234";
const CODE_DOC  = "app";        // rentals_v2/app  → الشيفرة
const MARKER    = "DIWAN_APP";  // علامة التحقق من الملف
/* ═════════════════════════════ */

var db=null, booted=false;
function $(id){ return document.getElementById(id); }

function openPanel(reason){
  $('root').innerHTML="";
  $('boot').classList.add('hide');
  $('panel').classList.remove('hide');
  if(reason){ $('pinMsg').style.color="#C0392B"; $('pinMsg').textContent=reason; }
}
function checkPin(){
  if($('pin').value===ADMIN_PIN){
    $('pinBox').classList.add('hide');
    $('tools').classList.remove('hide');
    showVer();
  }else{
    $('pinMsg').style.color="#C0392B";
    $('pinMsg').textContent="الرمز غير صحيح";
    $('pin').value="";
  }
}
function say(t,c){ $('msg').style.color=c||"#44584E"; $('msg').textContent=t; }
async function showVer(){
  try{
    var s=await db.collection("rentals_v2").doc(CODE_DOC).get();
    $('ver').textContent = (s.exists && s.data().version)
      ? "النسخة الحالية: "+new Date(s.data().version).toLocaleString('ar-SA')
      : "لا توجد نسخة منشورة بعد";
  }catch(e){ $('ver').textContent=""; }
}
async function publish(){
  var f=$('file').files[0];
  if(!f){ say("اختر الملف أولاً","#C0392B"); return; }
  say("جارٍ القراءة…");
  try{
    var text=await f.text();
    if(text.length<2000){ say("الملف صغير جداً — تأكد أنه الملف الصحيح","#C0392B"); return; }
    if(text.slice(0,200).indexOf(MARKER)<0){ say("الملف لا يحمل علامة "+MARKER+" — رُفض","#C0392B"); return; }
    say("جارٍ النشر…");
    var ref=db.collection("rentals_v2").doc(CODE_DOC);
    var cur=await ref.get();
    var prev = cur.exists ? (cur.data().code||"") : "";
    await ref.set({ code:text, prev:prev, version:Date.now() });
    say("تم النشر بنجاح ✅ — افتح التطبيق","#0A4D30");
    showVer();
  }catch(e){ say("فشل النشر: "+(e.message||e),"#C0392B"); }
}
async function rollback(){
  if(!confirm("الرجوع للنسخة السابقة؟")) return;
  say("جارٍ الاسترجاع…");
  try{
    var ref=db.collection("rentals_v2").doc(CODE_DOC);
    var s=await ref.get();
    if(!s.exists || !s.data().prev){ say("لا توجد نسخة سابقة محفوظة","#C0392B"); return; }
    var d=s.data();
    await ref.set({ code:d.prev, prev:d.code, version:Date.now() });
    say("تم الرجوع للنسخة السابقة ✅","#0A4D30");
    showVer();
  }catch(e){ say("فشل الاسترجاع: "+(e.message||e),"#C0392B"); }
}
async function downloadCur(){
  try{
    var s=await db.collection("rentals_v2").doc(CODE_DOC).get();
    if(!s.exists||!s.data().code){ say("لا توجد نسخة منشورة","#C0392B"); return; }
    var a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([s.data().code],{type:"text/javascript"}));
    a.download="app-backup.js"; a.click();
    say("تم التنزيل ✅","#0A4D30");
  }catch(e){ say("فشل التنزيل","#C0392B"); }
}

/* شبكة أمان: أي خطأ في التطبيق يفتح اللوحة */
window.addEventListener("error", function(){
  if(!window.__APP_OK && !booted) openPanel("تعطل التطبيق — يمكنك الرجوع للنسخة السابقة");
});

(async function(){
  if(!window.firebase || !firebase.firestore){
    $('bootMsg').textContent="تعذّر الاتصال بالإنترنت — حدّث الصفحة"; return;
  }
  firebase.initializeApp(FIREBASE_CONFIG);
  db=firebase.firestore();
  window.__FB = { db: db, fs: firebase.firestore, dataRef: db.collection("rentals_v2").doc("state") };

  if(location.hash==="#update"){ openPanel(); return; }

  var s;
  try{ s=await db.collection("rentals_v2").doc(CODE_DOC).get(); }
  catch(e){ openPanel("تعذّر قراءة الشيفرة من Firebase"); return; }

  if(!s.exists || !s.data().code){ openPanel("لا توجد نسخة منشورة — انشر ملف app.js"); return; }

  $('boot').classList.add('hide');
  var sc=document.createElement("script");
  sc.textContent=s.data().code;
  document.body.appendChild(sc);

  setTimeout(function(){
    if(!window.__APP_OK) openPanel("لم يعمل التطبيق — يمكنك الرجوع للنسخة السابقة");
    else booted=true;
  },900);
})();
</script>
</body>
</html>
