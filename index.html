<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ديوان الإيجارات">
<meta name="theme-color" content="#0A4D30">
<title>ديوان الإيجارات</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:'Tajawal',system-ui,sans-serif;background:#EEF2F0;color:#16281F;
     display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.card{background:#fff;border-radius:20px;padding:26px 22px;width:100%;max-width:420px;
      box-shadow:0 10px 34px rgba(0,0,0,.10)}
h1{font-size:1.35rem;color:#0A4D30;margin:0 0 4px;text-align:center}
.sub{text-align:center;color:#6B7C74;font-size:.82rem;margin-bottom:18px}
.note{background:#F2F6F4;border-radius:12px;padding:12px 14px;font-size:.8rem;
      color:#44584E;line-height:1.7;margin-bottom:16px}
label{display:block;font-size:.82rem;font-weight:500;margin:14px 0 6px}
input[type=file],input[type=password]{width:100%;padding:12px;border:1px solid #D9E2DD;
      border-radius:12px;font-family:inherit;font-size:.95rem;background:#fff}
button{width:100%;padding:14px;border:none;border-radius:14px;font-family:inherit;
      font-size:.98rem;font-weight:700;cursor:pointer;margin-top:10px}
.pri{background:#0A4D30;color:#fff}
.dan{background:#FDECEC;color:#C0392B}
.sec{background:#EEF2F0;color:#16281F}
.msg{text-align:center;font-size:.85rem;min-height:20px;margin-top:12px;line-height:1.6}
.ver{text-align:center;font-size:.72rem;color:#8A9A92;margin-top:14px}
a{color:#0A4D30}
.hide{display:none}
</style>
</head>
<body>

<div class="card" id="boot">
  <h1>ديوان الإيجارات</h1>
  <div class="sub">جارٍ تحميل التطبيق…</div>
  <div class="msg" id="bootMsg"></div>
</div>

<div class="card hide" id="panel">
  <h1>لوحة تحديث التطبيق</h1>
  <div class="sub">خاصة بالمالك</div>

  <div id="pinBox">
    <label>رمز الإدارة</label>
    <input type="password" id="pin" inputmode="numeric" onkeydown="if(event.key==='Enter')checkPin()">
    <button class="pri" onclick="checkPin()">دخول</button>
    <div class="msg" id="pinMsg"></div>
  </div>

  <div id="tools" class="hide">
    <div class="note">
      اختر ملف التطبيق الجديد ثم اضغط نشر. سيصل التحديث لكل الأجهزة فوراً،
      وبيانات المستأجرين لا تتأثر إطلاقاً لأنها محفوظة في مكان منفصل.
    </div>
    <label>ملف التطبيق (.html)</label>
    <input type="file" id="file" accept=".html,.htm,.txt">
    <button class="pri" onclick="publish()">نشر النسخة الجديدة</button>
    <button class="dan" onclick="rollback()">الرجوع للنسخة السابقة</button>
    <button class="sec" onclick="downloadCur()">تنزيل النسخة الحالية</button>
    <button class="sec" onclick="location.hash='';location.reload()">رجوع للتطبيق</button>
    <div class="msg" id="msg"></div>
    <div class="ver" id="ver"></div>
  </div>
</div>

<script>
/* ═════════ الإعدادات ═════════ */
const FIREBASE_CONFIG = {
  apiKey:"AIzaSyCuBqtDkxXl8JBKNNm53vRq03fW_GhIkbk",
  authDomain:"zaid-f4b3d.firebaseapp.com",
  projectId:"zaid-f4b3d"
};
const ADMIN_PIN = "1234";
/* ═════════════════════════════ */

let db=null;
const $ = id => document.getElementById(id);

function loadScript(src){
  return new Promise((ok,no)=>{
    const s=document.createElement('script'); s.src=src;
    s.onload=()=>ok(true); s.onerror=()=>no(new Error(src));
    document.head.appendChild(s);
  });
}
async function ensureFirebase(){
  if(window.firebase && firebase.firestore) return true;
  const bases=[
    "https://www.gstatic.com/firebasejs/10.12.2/",
    "https://cdnjs.cloudflare.com/ajax/libs/firebase/10.10.0-20240326182825/"
  ];
  for(const b of bases){
    try{
      await loadScript(b+"firebase-app-compat.js");
      await loadScript(b+"firebase-firestore-compat.js");
      if(window.firebase && firebase.firestore) return true;
    }catch(e){}
  }
  return false;
}

function checkPin(){
  if($('pin').value===ADMIN_PIN){
    $('pinBox').classList.add('hide');
    $('tools').classList.remove('hide');
    showVer();
  }else{
    $('pinMsg').style.color="#C0392B";
    $('pinMsg').textContent="الرمز غير صحيح";
    $('pin').value="";
  }
}

async function showVer(){
  try{
    const s=await db.collection("app").doc("current").get();
    $('ver').textContent = s.exists && s.data().at
      ? "النسخة الحالية: "+new Date(s.data().at).toLocaleString('ar-SA')
      : "لا توجد نسخة منشورة بعد";
  }catch(e){ $('ver').textContent=""; }
}

function say(t,c){ $('msg').style.color=c||"#44584E"; $('msg').textContent=t; }

async function publish(){
  const f=$('file').files[0];
  if(!f){ say("اختر الملف أولاً","#C0392B"); return; }
  say("جارٍ القراءة…");
  try{
    const text=await f.text();
    if(text.length<1000 || !/<html/i.test(text)){
      say("هذا لا يبدو ملف تطبيق صحيح — تأكد أنه ملف HTML","#C0392B"); return;
    }
    say("جارٍ النشر…");
    const cur=await db.collection("app").doc("current").get();
    if(cur.exists) await db.collection("app").doc("previous").set(cur.data());
    await db.collection("app").doc("current").set({html:text, at:Date.now()});
    say("تم النشر بنجاح ✅ — أعد فتح التطبيق","#0A4D30");
    showVer();
  }catch(e){
    say("فشل النشر: "+(e.message||e),"#C0392B");
  }
}

async function rollback(){
  if(!confirm("الرجوع للنسخة السابقة؟")) return;
  say("جارٍ الاسترجاع…");
  try{
    const prev=await db.collection("app").doc("previous").get();
    if(!prev.exists){ say("لا توجد نسخة سابقة محفوظة","#C0392B"); return; }
    await db.collection("app").doc("current").set(prev.data());
    say("تم الرجوع للنسخة السابقة ✅","#0A4D30");
    showVer();
  }catch(e){ say("فشل الاسترجاع: "+(e.message||e),"#C0392B"); }
}

async function downloadCur(){
  try{
    const s=await db.collection("app").doc("current").get();
    if(!s.exists){ say("لا توجد نسخة منشورة","#C0392B"); return; }
    const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([s.data().html],{type:"text/html"}));
    a.download="diwan-backup.html"; a.click();
    say("تم التنزيل ✅","#0A4D30");
  }catch(e){ say("فشل التنزيل","#C0392B"); }
}

(async ()=>{
  const ok=await ensureFirebase();
  if(!ok){ $('bootMsg').textContent="تعذّر الاتصال بالإنترنت — حدّث الصفحة"; return; }
  firebase.initializeApp(FIREBASE_CONFIG);
  db=firebase.firestore();

  if(location.hash==="#update"){
    $('boot').classList.add('hide');
    $('panel').classList.remove('hide');
    return;
  }

  try{
    const s=await db.collection("app").doc("current").get();
    if(!s.exists || !s.data().html){
      $('bootMsg').innerHTML='لا توجد نسخة منشورة بعد.<br><a href="#update" onclick="setTimeout(()=>location.reload(),50)">افتح لوحة التحديث</a>';
      return;
    }
    document.open(); document.write(s.data().html); document.close();
  }catch(e){
    $('bootMsg').innerHTML='تعذّر تحميل التطبيق.<br><a href="#update" onclick="setTimeout(()=>location.reload(),50)">افتح لوحة التحديث</a>';
  }
})();
</script>
</body>
</html>
